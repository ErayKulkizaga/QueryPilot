services:
  postgres:
    image: postgres:17-alpine
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    environment:
      POSTGRES_DB: querypilot
      POSTGRES_USER: querypilot_owner
      POSTGRES_PASSWORD: "${QUERYPILOT_POSTGRES_OWNER_PASSWORD:-querypilot_owner_dev}"
      QUERYPILOT_POSTGRES_APP_PASSWORD: "${QUERYPILOT_POSTGRES_APP_PASSWORD:-querypilot_app_dev}"
    ports:
      - "127.0.0.1:${QUERYPILOT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(psql -U querypilot_owner -d querypilot -tAc \"SELECT CASE WHEN to_regclass('public.customers') IS NOT NULL AND to_regclass('public.querypilot_workload_queries') IS NOT NULL AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'querypilot_app') THEN 1 ELSE 0 END\")\" = \"1\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - querypilot-postgres-data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./sql/003_permissions.sh:/docker-entrypoint-initdb.d/003_permissions.sh:ro
      - ./sql/004_workload_stats.sql:/docker-entrypoint-initdb.d/004_workload_stats.sql:ro

volumes:
  querypilot-postgres-data:
