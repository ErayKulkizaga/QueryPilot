name: QueryPilot release gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: public-demo/package-lock.json

      - name: Upgrade Python packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install public demo dependencies
        working-directory: public-demo
        run: npm ci

      - name: Run release and plan-regression gate
        run: python -m scripts.release_check

      - name: Start isolated PostgreSQL fixture
        run: docker compose up -d --wait

      - name: Run live workload and baseline checks
        env:
          QUERYPILOT_BASELINE_DATABASE_PATH: ${{ runner.temp }}/querypilot-baselines.sqlite3
          QUERYPILOT_PILOT_DATABASE_URL: postgresql://querypilot_app:querypilot_app_dev@127.0.0.1:5432/querypilot
        run: |
          python -m scripts.workload_smoke --output "$RUNNER_TEMP/workload-smoke.json"
          python -m scripts.baseline_smoke
          python -m scripts.plan_contract_check --output "$RUNNER_TEMP/plan-contract-result.json"
          python -m scripts.non_production_pilot \
            contracts/pilot_queries.example.json \
            --expected-database querypilot \
            --output "$RUNNER_TEMP/non-production-pilot.json" \
            --acknowledge-authorized-non-production \
            --allow-explain-analyze

      - name: Install Chromium for the UI test
        run: python -m playwright install --with-deps chromium

      - name: Run the real-browser Streamlit workflow
        env:
          QUERYPILOT_BASELINE_DATABASE_PATH: ${{ runner.temp }}/querypilot-e2e-baselines.sqlite3
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            >"$RUNNER_TEMP/querypilot-api.log" 2>&1 &
          api_pid=$!
          python -m streamlit run streamlit_app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            >"$RUNNER_TEMP/querypilot-ui.log" 2>&1 &
          ui_pid=$!
          cleanup() {
            kill "$api_pid" "$ui_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/querypilot-api.log"
            cat "$RUNNER_TEMP/querypilot-ui.log"
            exit 1
          fi

          python -m pytest e2e_tests/test_streamlit_workflow.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure

      - name: Stop PostgreSQL fixture
        if: always()
        run: docker compose down -v
